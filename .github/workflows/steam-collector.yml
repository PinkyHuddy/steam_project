name: Steam CCU Collector (15m cron + dedupe)

permissions:
  contents: write

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: steam-ccu-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Steam collector
        run: |
          python steam_pull.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/steam_ccu_log.csv
          git commit -m "Update Steam CCU log" || echo "No changes to commit"
          git push
          git commit -m "Update Steam CCU log (scheduled)" || echo "No changes to commit"
          git push

